[project]
name = "bibtex-assertion"
version = "0.3.1"
description = "Assert that BibTeX entries describe real papers with correct authors, venue and year, using free scholarly APIs plus an LLM adjudicator."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.32",
    "openai>=1.40",
]

[project.scripts]
bibtex-assert = "bibtex_assertion.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bibtex_assertion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that call live APIs (deselected by default)"]
addopts = "-m 'not network'"
